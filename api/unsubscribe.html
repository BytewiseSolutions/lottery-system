<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Total Free Lotto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #333; margin-bottom: 20px; font-size: 28px; }
        p { color: #666; line-height: 1.6; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        .success { background: #10b981; color: white; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: none; }
        .error { background: #ef4444; color: white; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Unsubscribe</h1>
        <div class="success" id="success">You have been successfully unsubscribed from our mailing list.</div>
        <div class="error" id="error">Failed to unsubscribe. Please try again.</div>
        <p>We're sorry to see you go! Enter your email address below to unsubscribe from Total Free Lotto notifications.</p>
        <form id="unsubscribeForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
            <button type="submit">Unsubscribe</button>
        </form>
        <p style="margin-top: 30px; font-size: 14px; text-align: center;">
            <a href="https://totalfreelotto.com" style="color: #667eea; text-decoration: none;">Return to Homepage</a>
        </p>
    </div>
    <script>
        document.getElementById('unsubscribeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            // Simulate API call
            setTimeout(() => {
                document.getElementById('success').style.display = 'block';
                document.getElementById('unsubscribeForm').style.display = 'none';
            }, 500);
        });
    </script>
</body>
</html>
