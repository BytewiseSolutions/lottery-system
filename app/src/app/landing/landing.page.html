<ion-header class="ion-no-border landing-header">
  <ion-toolbar>
    <ion-title slot="start">Total Free Lotto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openLogin()">
        <ion-icon name="person" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="landing-content">
  <div class="landing-container">
    <div class="info-section">
      <h1>Total Free Lottery</h1>
      <h2>Win Millions</h2>
      <p>Per entry, $0.01 goes to winning money.</p>
      <p>Play many times and increase pool money.</p>
      <ion-button expand="block" (click)="startMakingMoney()" class="start-btn">Start making money</ion-button>
    </div>
  </div>
</ion-content>
