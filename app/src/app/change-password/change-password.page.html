<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/settings"></ion-back-button>
    </ion-buttons>
    <ion-title>Change Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="change-password-container">
    <ion-card>
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Current Password</ion-label>
          <ion-input [(ngModel)]="currentPassword" type="password"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">New Password</ion-label>
          <ion-input [(ngModel)]="newPassword" type="password"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Confirm Password</ion-label>
          <ion-input [(ngModel)]="confirmPassword" type="password"></ion-input>
        </ion-item>
        <ion-button expand="block" (click)="save()" [disabled]="loading">
          <ion-icon name="key" slot="start"></ion-icon>
          Change Password
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
