<ion-header>
  <ion-toolbar color="none">
    <div class="header-content">
      <div class="prize-header">
        <h1>$ {{ totalWinnings.toFixed(2) }} Winning Money Now</h1>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content color="none">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  
  <div [ngSwitch]="selectedTab">
    <div *ngSwitchCase="'home'">
      <div *ngFor="let draw of upcomingDraws" class="lottery-card">
        <div class="lottery-header">
          <h2>{{ draw.name }}</h2>
          <p class="draw-date">For {{ draw.draw_date | date:'EEEE, MMMM d, y' }}</p>
        </div>
        <div class="lottery-body">
          <div class="jackpot">${{ draw.jackpot }}</div>
          <ion-button expand="block" color="primary" (click)="playLottery(draw)">Play</ion-button>
          <div class="countdown">
            <p>Next Draw :</p>
            <div class="timer">{{ getCountdown(draw.draw_date) }}</div>
          </div>
        </div>
      </div>
      <p *ngIf="upcomingDraws.length === 0" class="no-draws">No upcoming draws</p>
    </div>

    <div *ngSwitchCase="'entries'">
      <app-entries></app-entries>
    </div>

    <div *ngSwitchCase="'results'">
      <app-results></app-results>
    </div>

    <div *ngSwitchCase="'profile'">
      <app-profile [userName]="userName" (logoutClick)="logout()"></app-profile>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar class="bottom-nav">
    <ion-tab-bar>
      <ion-tab-button (click)="selectedTab = 'home'" [class.active]="selectedTab === 'home'">
        <ion-icon name="home"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>
      <ion-tab-button (click)="selectedTab = 'entries'" [class.active]="selectedTab === 'entries'">
        <ion-icon name="ticket"></ion-icon>
        <ion-label>Entries</ion-label>
      </ion-tab-button>
      <ion-tab-button (click)="selectedTab = 'results'" [class.active]="selectedTab === 'results'">
        <ion-icon name="trophy"></ion-icon>
        <ion-label>Results</ion-label>
      </ion-tab-button>
      <ion-tab-button (click)="selectedTab = 'profile'" [class.active]="selectedTab === 'profile'">
        <ion-icon name="person"></ion-icon>
        <ion-label>Profile</ion-label>
        <ion-badge *ngIf="unreadNotifications > 0" color="danger">{{ unreadNotifications }}</ion-badge>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-toolbar>
</ion-footer>
