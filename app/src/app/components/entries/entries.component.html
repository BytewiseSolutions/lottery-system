<div *ngFor="let entry of entries" class="entry-card">
  <div class="entry-header">
    <h3>{{ entry.lottery }}</h3>
    <span class="entry-date">{{ entry.created_at | date:'MMM d, y h:mm a' }}</span>
  </div>
  <div class="entry-body">
    <div class="numbers-section">
      <p class="label">Main Numbers</p>
      <div class="numbers-grid">
        <span *ngFor="let num of parseNumbers(entry.numbers)" 
              class="number-badge"
              [class.matched]="isNumberMatch(num, getResultForEntry(entry))"
              [class.unmatched]="getResultForEntry(entry) && !isNumberMatch(num, getResultForEntry(entry))">
          {{ num }}
          <ion-icon *ngIf="isNumberMatch(num, getResultForEntry(entry))" name="checkmark" class="check-icon"></ion-icon>
          <ion-icon *ngIf="getResultForEntry(entry) && !isNumberMatch(num, getResultForEntry(entry))" name="close" class="close-icon"></ion-icon>
        </span>
      </div>
    </div>
    <div class="numbers-section">
      <p class="label">Bonus Numbers</p>
      <div class="numbers-grid">
        <span *ngFor="let num of parseNumbers(entry.bonus_numbers)" 
              class="number-badge bonus"
              [class.matched]="isBonusMatch(num, getResultForEntry(entry))"
              [class.unmatched]="getResultForEntry(entry) && !isBonusMatch(num, getResultForEntry(entry))">
          {{ num }}
          <ion-icon *ngIf="isBonusMatch(num, getResultForEntry(entry))" name="checkmark" class="check-icon"></ion-icon>
          <ion-icon *ngIf="getResultForEntry(entry) && !isBonusMatch(num, getResultForEntry(entry))" name="close" class="close-icon"></ion-icon>
        </span>
      </div>
    </div>
    <p class="draw-info">Draw: {{ entry.draw_date | date:'EEEE, MMMM d, y' }}</p>
  </div>
</div>
<p *ngIf="entries.length === 0" class="no-data">You have no entries yet</p>
