<div class="details-page">
  <div class="mobile-sidebar-overlay" [class.active]="isMobileSidebarOpen" (click)="closeMobileSidebar()"></div>

  <div class="details-layout">
    <aside class="sidebar-shell" [class.mobile-open]="isMobileSidebarOpen">
      <app-admin-sidebar
        [activeSection]="'users'"
        [totalResults]="totalResults"
        [isConnected]="isConnected"
        [lastLogin]="lastLogin"
        [adminName]="adminName"
        (sectionChange)="navigateToSection($event); closeMobileSidebar()"
        (logoutClick)="onLogout()">
      </app-admin-sidebar>
    </aside>

    <main class="details-main">
      <header class="top-bar">
        <div class="breadcrumb">
          <a (click)="navigateToSection('dashboard')">Dashboard</a>
          <i class="fas fa-chevron-right"></i>
          <a (click)="goBackToUsers()">User Management</a>
          <i class="fas fa-chevron-right"></i>
          <span>User Details</span>
        </div>

        <button type="button" class="mobile-sidebar-toggle" (click)="toggleMobileSidebar()">
          <i class="fas fa-bars"></i>
        </button>

        <div class="top-bar-actions">
          <button type="button" class="back-button" (click)="goBackToUsers()">
            <i class="fas fa-arrow-left"></i>
            Back to Users
          </button>
        </div>
      </header>

      @if (loading) {
        <div class="state-card">
          <i class="fas fa-spinner fa-spin"></i>
          <span>Loading user details...</span>
        </div>
      } @else if (errorMessage) {
        <div class="state-card error">
          <i class="fas fa-exclamation-circle"></i>
          <span>{{ errorMessage }}</span>
        </div>
      } @else if (user) {
        <app-user-details
          [user]="user"
          (closeDetails)="goBackToUsers()"
          (editUser)="onEditUser($event)">
        </app-user-details>
      }
    </main>
  </div>
</div>
