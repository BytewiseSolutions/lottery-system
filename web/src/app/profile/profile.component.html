<app-layout>
  <section class="profile-section" style="padding: 60px 0; min-height: 70vh;">
    <div class="container">
      <h2 class="section-title" style="text-align: center; margin-bottom: 40px;">My Profile</h2>
      
      <div class="row">
        <div class="col-lg-12">
          <div class="profile-card" style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            
            <!-- Account Statistics -->
            <div class="stats-section" style="margin-bottom: 30px;">
              <h4 style="margin-bottom: 20px;">Account Statistics</h4>
              <div class="row">
                <div class="col-md-4">
                  <div class="stat-box" style="text-align: center; padding: 20px; background: linear-gradient(90deg, rgb(108, 0, 146) 0%, rgb(175, 0, 255) 100%); color: white; border-radius: 8px; min-height: 120px; display: flex; flex-direction: column; justify-content: center;">
                    <h3>{{ stats.totalEntries }}</h3>
                    <p>Total Entries</p>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="stat-box" style="text-align: center; padding: 20px; background: linear-gradient(90deg, rgb(108, 0, 146) 0%, rgb(175, 0, 255) 100%); color: white; border-radius: 8px; min-height: 120px; display: flex; flex-direction: column; justify-content: center;">
                    <h3>${{ stats.totalWinnings }}</h3>
                    <p>Total Winnings</p>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="stat-box" style="text-align: center; padding: 20px; background: linear-gradient(90deg, rgb(108, 0, 146) 0%, rgb(175, 0, 255) 100%); color: white; border-radius: 8px; min-height: 120px; display: flex; flex-direction: column; justify-content: center;">
                    <h3 style="font-size: 1.5rem;">{{ stats.memberSince }}</h3>
                    <p>Member Since</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Personal Information -->
            <div class="info-section">
              <h4 style="margin-bottom: 20px;">Personal Information</h4>
              
              <!-- Profile Picture Section -->
              <div class="profile-picture-section" style="margin-bottom: 30px; text-align: center;">
                <div class="picture-preview" style="margin-bottom: 15px;">
                  <img [src]="previewUrl || 'assets/images/default-avatar.svg'" 
                       alt="Profile Picture" 
                       style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #ddd;">
                </div>
                <div *ngIf="isEditing" class="picture-controls">
                  <input type="file" 
                         #fileInput 
                         (change)="onFileSelected($event)" 
                         accept="image/*" 
                         style="display: none;">
                  <button type="button" class="custom-button1" (click)="fileInput.click()" style="margin-right: 10px;">Choose Picture</button>
                  <button type="button" 
                          class="custom-button2" 
                          (click)="uploadProfilePicture()" 
                          [disabled]="!selectedFile || isUploadingPicture"
                          *ngIf="selectedFile">
                    {{ isUploadingPicture ? 'Uploading...' : 'Upload' }}
                  </button>
                  <button type="button" 
                          class="custom-button1" 
                          (click)="removeProfilePicture()" 
                          *ngIf="previewUrl"
                          style="margin-left: 10px;">
                    Remove
                  </button>
                </div>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">Max file size: 5MB. Supported formats: JPG, PNG, GIF</p>
              </div>
              
              <form (ngSubmit)="updateProfile()">
                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group" style="margin-bottom: 20px;">
                      <label>First Name</label>
                      <input type="text" class="form-control" [(ngModel)]="profile.firstName" name="firstName" [disabled]="!isEditing" style="width: 100%; display: block;">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group" style="margin-bottom: 20px;">
                      <label>Last Name</label>
                      <input type="text" class="form-control" [(ngModel)]="profile.lastName" name="lastName" [disabled]="!isEditing" style="width: 100%; display: block;">
                    </div>
                  </div>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                  <label>Email</label>
                  <input type="email" class="form-control" [(ngModel)]="profile.email" name="email" [disabled]="!isEditing" style="width: 100%; display: block;">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                  <label>Phone Number</label>
                  <input type="tel" class="form-control" [(ngModel)]="profile.phone" name="phone" [disabled]="!isEditing" style="width: 100%; display: block;">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                  <label>Country</label>
                  <div style="position: relative;">
                    <input 
                      type="text" 
                      class="form-control" 
                      [(ngModel)]="profile.country" 
                      name="country" 
                      [disabled]="!isEditing"
                      (input)="filterCountries($event)"
                      (focus)="showCountryDropdown = isEditing"
                      placeholder="Type to search country"
                      autocomplete="off"
                      style="width: 100%; display: block;">
                    <div *ngIf="showCountryDropdown && filteredCountries.length > 0" class="country-dropdown">
                      <div 
                        *ngFor="let c of filteredCountries.slice(0, 5)" 
                        class="country-option" 
                        (click)="selectCountry(c)">
                        {{ c }}
                      </div>
                    </div>
                  </div>
                </div>
                
                <div class="button-group" style="margin-top: 30px;">
                  <button type="button" *ngIf="!isEditing" class="custom-button2" (click)="toggleEdit()">Edit Profile</button>
                  <button type="submit" *ngIf="isEditing" class="custom-button2" [disabled]="isSaving">
                    {{ isSaving ? 'Saving...' : 'Save Changes' }}
                  </button>
                  <button type="button" *ngIf="isEditing" class="custom-button1" (click)="cancelEdit()" style="margin-left: 10px;">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</app-layout>
