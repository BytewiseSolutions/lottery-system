@if (isOpen) {
  <div class="modal-overlay" (click)="onCancel()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Create Notification</h2>
        <button class="close-btn" (click)="onCancel()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <div class="modal-body">
        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="title">Title *</label>
            <input 
              type="text" 
              id="title" 
              [(ngModel)]="formData.title" 
              name="title"
              placeholder="Enter notification title"
              required>
          </div>
          
          <div class="form-group">
            <label for="message">Message *</label>
            <textarea 
              id="message" 
              [(ngModel)]="formData.message" 
              name="message"
              rows="4"
              placeholder="Enter notification message"
              required></textarea>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="type">Type</label>
              <select id="type" [(ngModel)]="formData.type" name="type">
                <option value="info">Info</option>
                <option value="success">Success</option>
                <option value="warning">Warning</option>
                <option value="error">Error</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="recipient">Recipients</label>
              <select id="recipient" [(ngModel)]="formData.recipient_type" name="recipient">
                <option value="all">All Users</option>
                <option value="admins">Admins Only</option>
                <option value="users">Regular Users</option>
              </select>
            </div>
          </div>
          
          <div class="modal-actions">
            <button type="button" class="cancel-btn" (click)="onCancel()" [disabled]="loading">
              Cancel
            </button>
            <button type="submit" class="create-submit-btn" [disabled]="loading">
              @if (loading) {
                <i class="fas fa-spinner fa-spin"></i>
              }
              {{ loading ? 'Creating...' : 'Create Notification' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
