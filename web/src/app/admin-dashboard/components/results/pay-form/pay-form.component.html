<form class="pay-form" (ngSubmit)="onSubmit()">
  <div class="winner-info">
    <h3>Winner Information</h3>
    <div class="info-grid">
      <div class="info-item">
        <label>Name</label>
        <span>{{winner?.name}}</span>
      </div>
      <div class="info-item">
        <label>Email</label>
        <span>{{winner?.email}}</span>
      </div>
      <div class="info-item">
        <label>Prize Amount</label>
        <span class="prize">M{{winner?.prize_amount}}</span>
      </div>
      <div class="info-item">
        <label>Payment Status</label>
        <span class="badge" [class]="winner?.payment_status">{{winner?.payment_status}}</span>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="amount">Payment Amount *</label>
    <input 
      type="number" 
      id="amount" 
      step="0.01" 
      min="0" 
      [max]="winner?.prize_amount"
      [(ngModel)]="formData.amount" 
      name="amount" 
      placeholder="0.00" 
      required>
  </div>

  <div class="form-group">
    <label for="payment_method">Payment Method *</label>
    <select id="payment_method" [(ngModel)]="formData.payment_method" name="payment_method" required>
      <option value="">Select payment method...</option>
      <option value="bank_transfer">Bank Transfer</option>
      <option value="mobile_money">Mobile Money</option>
      <option value="cash">Cash</option>
      <option value="check">Check</option>
    </select>
  </div>

  <div class="form-group">
    <label for="transaction_id">Transaction ID</label>
    <input 
      type="text" 
      id="transaction_id" 
      [(ngModel)]="formData.transaction_id" 
      name="transaction_id" 
      placeholder="Enter transaction reference...">
  </div>

  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="!isFormValid()">Process Payment</button>
  </div>
</form>
