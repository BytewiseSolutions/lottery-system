<div class="success-popup" [class.show]="showPopup" *ngIf="showPopup">
  <div class="success-content">
    <button class="close-btn" (click)="dismiss()">&times;</button>
    <div class="success-icon">✓</div>
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <button class="custom-button2" (click)="dismiss()" style="margin-top: 20px;">Continue</button>
  </div>
</div>
