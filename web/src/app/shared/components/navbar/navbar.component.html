<header class="modern-navbar">
  <nav class="navbar-container">
    <div class="navbar-content">
      <a routerLink="/" class="navbar-logo">
        <img src="assets/images/logoo.png" alt="Total Free Lotto">
      </a>

      <ul class="navbar-menu" [class.mobile-open]="mobileMenuOpen">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="mobileMenuOpen = false">Home</a></li>
        <li><a routerLink="/lotteries" routerLinkActive="active" (click)="mobileMenuOpen = false">Lotteries</a></li>
        <li><a routerLink="/results" routerLinkActive="active" (click)="mobileMenuOpen = false">Results</a></li>
        <li><a routerLink="/about" routerLinkActive="active" (click)="mobileMenuOpen = false">About</a></li>
        <li><a routerLink="/faq" routerLinkActive="active" (click)="mobileMenuOpen = false">FAQ</a></li>
        <li><a routerLink="/history" routerLinkActive="active" (click)="mobileMenuOpen = false">History</a></li>
        <li><a routerLink="/contact" routerLinkActive="active" (click)="mobileMenuOpen = false">Contact</a></li>
      </ul>

      <div class="navbar-actions">
        <div class="jackpot-display">
          <span class="jackpot-label">Jackpot</span>
          <span class="jackpot-amount">${{totalPoolMoney | number:'1.2-2'}}</span>
        </div>
        
        <div class="auth-buttons" *ngIf="!isLoggedIn">
          <button class="btn-login" (click)="openLoginModal()">Login</button>
          <button class="btn-signup" (click)="openRegisterModal()">Sign Up</button>
        </div>
        
        <div class="auth-buttons" *ngIf="isLoggedIn">
          <button class="btn-logout" (click)="logout()">Logout</button>
        </div>
      </div>

      <button class="mobile-toggle" [class.active]="mobileMenuOpen" (click)="toggleMobileMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>
</header>

<app-login 
  [isVisible]="showLoginModal"
  (loginSuccess)="onLoginSuccess($event)"
  (closeModal)="onCloseLogin()"
  (switchToSignupEvent)="onSwitchToSignup()"
  (switchToVerificationEvent)="onSwitchToVerification()"
  (switchToPasswordRecoveryEvent)="onSwitchToPasswordRecovery()">
</app-login>

<app-signup 
  [isVisible]="showSignupModal"
  [verificationMode]="verificationMode"
  [passwordRecoveryMode]="passwordRecoveryMode"
  (signupSuccess)="onSignupSuccess($event)"
  (closeModal)="onCloseSignup()"
  (switchToLoginEvent)="onSwitchToLogin()">
</app-signup>
