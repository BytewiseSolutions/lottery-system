<app-layout>
  <section class="settings-section" style="padding: 60px 0; min-height: 70vh;">
    <div class="container">
      <h2 class="section-title" style="text-align: center; margin-bottom: 40px;">Settings</h2>
      
      <div class="row">
        <div class="col-lg-12">
          
          <!-- Change Password -->
          <div class="settings-card" style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px;">
            <h4 style="margin-bottom: 20px;">Change Password</h4>
            <form (ngSubmit)="changePassword()">
              <div class="form-group" style="margin-bottom: 20px;">
                <label>Current Password</label>
                <input type="password" class="form-control" [(ngModel)]="passwordForm.currentPassword" name="currentPassword" required style="width: 100%; display: block;">
              </div>
              <div class="form-group" style="margin-bottom: 20px;">
                <label>New Password</label>
                <input type="password" class="form-control" [(ngModel)]="passwordForm.newPassword" name="newPassword" required style="width: 100%; display: block;">
              </div>
              <div class="form-group" style="margin-bottom: 20px;">
                <label>Confirm New Password</label>
                <input type="password" class="form-control" [(ngModel)]="passwordForm.confirmPassword" name="confirmPassword" required style="width: 100%; display: block;">
              </div>
              <button type="submit" class="custom-button2" [disabled]="isChangingPassword">
                {{ isChangingPassword ? 'Changing...' : 'Change Password' }}
              </button>
            </form>
          </div>

          <!-- Account Actions -->
          <div class="settings-card" style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            <h4 style="margin-bottom: 20px; color: #d32f2f;">Danger Zone</h4>
            <p style="margin-bottom: 20px;">Once you delete your account, there is no going back. Please be certain.</p>
            <button type="button" class="btn btn-danger" (click)="confirmDeleteAccount()">Delete Account</button>
          </div>

        </div>
      </div>
    </div>
  </section>
</app-layout>
